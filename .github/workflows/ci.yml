name: "CI — Smoke Test"

on:
  push:
    paths:
      - "ai_radar/**"
  pull_request:
    paths:
      - "ai_radar/**"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ai_radar/requirements.txt

      - name: Run smoke test
        run: cd ai_radar && python smoke_test.py
