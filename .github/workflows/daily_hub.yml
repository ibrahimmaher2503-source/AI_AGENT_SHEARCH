name: "\U0001F9E0 AI Radar — Daily Run"

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
      NOTION_DB_MODELS: ${{ secrets.NOTION_DB_MODELS }}
      NOTION_DB_TOOLS: ${{ secrets.NOTION_DB_TOOLS }}
      NOTION_DB_RESEARCH: ${{ secrets.NOTION_DB_RESEARCH }}
      NOTION_DB_SIGNALS: ${{ secrets.NOTION_DB_SIGNALS }}
      NOTION_DB_OPPORTUNITIES: ${{ secrets.NOTION_DB_OPPORTUNITIES }}
      NOTION_DB_BRIEFS: ${{ secrets.NOTION_DB_BRIEFS }}
      NOTION_DB_OSS_RADAR: ${{ secrets.NOTION_DB_OSS_RADAR }}
      NOTION_DB_HF_RADAR: ${{ secrets.NOTION_DB_HF_RADAR }}
      NOTION_DB_ALERTS: ${{ secrets.NOTION_DB_ALERTS }}
      DRY_RUN: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r ai_radar/requirements.txt

      - name: "Stage 1 — Collect signals"
        id: collect
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 2
          retry_wait_seconds: 30
          command: cd ai_radar && python main.py --layer collect

      - name: "Stage 2 — Analyze & classify"
        id: analyze
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          command: cd ai_radar && python main.py --layer analyze

      - name: "Stage 3 — Publish to Notion"
        id: publish
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          command: cd ai_radar && python main.py --layer publish

  notify-failure:
    runs-on: ubuntu-latest
    needs: run-radar
    if: failure()
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `AI Radar daily run failed — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `The daily AI Radar run failed on ${new Date().toISOString()}.`,
              '',
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Please check the logs and fix the issue.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'automated'],
            });
